[ConditionList]
	Condition={
		ParameterName="InputSource"
		ParameterType="string"
	}
	Condition={
		ParameterName="DecoderFormat"
		ParameterType="string"
	}
	Condition={
		ParameterName="OutputDevice"
		ParameterType="string"
	}
	Condition={
		ParameterName="PathType"
		ParameterType="string"
	}
	Condition={
		ParameterName="PostMode"
		ParameterType="enum"
	}
	Condition={
		ParameterName="DigitalAudioFormat"
		ParameterType="enum"
	}
	Condition={
		ParameterName="EncoderFormat"
		ParameterType="enum"
	}
	Condition={
		ParameterName="SETarget"
		ParameterType="enum"
	}
	...
	# ParameterName : must be supported parameter name
	# ParameterType : can be "enum", "value", "string", according to parameter guild line

[StrategyList]
	#Decoder pipeline(Primary)
	Strategy={
		# MM : 16bit fixed point PCM
		Description=config filter list of the pipeline for fixed point PCM input at MM on primary path
		FilterList="Lpcm, Sync, Delay, Volume"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="PcmFix"
			PathType="Primary"
		}
	}
	Strategy={
		# MM : 32bit float PCM
		Description=config filter list of the pipeline for 32bit float PCM input at MM on primary path
		FilterList="Format, Lpcm, Sync, Delay, Volume"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="PcmFloat"
			PathType="Primary"
		}
	}

	#Decoder pipeline(Mmap)
	Strategy={
		# MM : MMAP Input
		Description=config filter list of the pipeline for MMAP input at MM
		FilterList="VmReader, Volume"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="PcmFix"
			PathType="Mmap"
		}
	}

	#Decoder pipeline(Offload/HwAvSync)
	Strategy={
		# DTV : AC3 Input
		# HDMI : AC3 Input
		Description=config filter list of the pipeline for AC3 input
		FilterList="Ac3, Sync"
		RequiredCondition={
			InputSource="DTV"
			InputSource="HDMI"
			DecoderFormat="Ac3"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : AC3 Input
		Description=config filter list of the pipeline for AC3 input
		FilterList="Ac3, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="Ac3"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# DTV : AC4 Input
		Description=config filter list of the pipeline for AC4 input
		FilterList="Ac4, Sync"
		RequiredCondition={
			InputSource="DTV"
			DecoderFormat="Ac4"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : AC4 Input
		Description=config filter list of the pipeline for AC4 input
		FilterList="Ac4, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="Ac4"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : AAC Input
		# DTV : AAC Input
		# HDMI : AAC Input
		Description=config filter list of the pipeline for AAC input
		FilterList="Aac, Sync"
		RequiredCondition={
			InputSource="DTV"
			InputSource="HDMI"
			DecoderFormat="Aac"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : AAC Input
		Description=config filter list of the pipeline for AAC input
		FilterList="Aac, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="Aac"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# DTV : MPEG Input
		# HDMI : MPEG Input
		Description=config filter list of the pipeline for MPEG input
		FilterList="Mpeg, Sync"
		RequiredCondition={
			InputSource="DTV"
			InputSource="HDMI"
			DecoderFormat="Mpeg"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : MPEG Input
		Description=config filter list of the pipeline for MPEG input
		FilterList="Mpeg, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="Mpeg"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : MPEG-H Input
		# DTV : MPEG-H Input
		Description=config filter list of the pipeline for MPEG-H input
		FilterList="MpegH, Sync"
		RequiredCondition={
			InputSource="MM"
			InputSource="DTV"
                        InputSource="HDMI"
			DecoderFormat="MpegH"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : DRA Input
		# DTV : DRA Input
		Description=config filter list of the pipeline for DRA input
		FilterList="Dra, Sync"
		RequiredCondition={
			InputSource="MM"
			InputSource="DTV"
			DecoderFormat="Dra"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : DTS Input
		# HDMI : DTS Input
		Description=config filter list of the pipeline for DTS input
		FilterList="Dts, Sync"
		RequiredCondition={
			InputSource="HDMI"
			DecoderFormat="Dts"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : DTS Input
		Description=config filter list of the pipeline for DTS input
		FilterList="Dts, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="Dts"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# HDMI : MAT Input
		Description=config filter list of the pipeline for MAT input
		FilterList="Mat, Sync"
		RequiredCondition={
			InputSource="HDMI"
			DecoderFormat="Mat"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : MAT Input
		Description=config filter list of the pipeline for MAT input
		FilterList="Mat, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="Mat"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# DTV : 16bit fixed point PCM
		# HDMI : 16bit fixed point PCM
		# ATV : 16bit fixed point PCM
		# ANALOG : 16bit float PCM
		Description=config filter list of the pipeline for fixed point PCM input
		FilterList="Lpcm, Sync"
		RequiredCondition={
			InputSource="DTV"
			InputSource="HDMI"
			InputSource="ATV"
			InputSource="ANALOG"
			DecoderFormat="PcmFix"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : 16bit fixed point PCM
		Description=config filter list of the pipeline for fixed point PCM input
		FilterList="Lpcm, Tempo, Sync"
		RequiredCondition={
			InputSource="MM"
			DecoderFormat="PcmFix"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}
	Strategy={
		# MM : 32bit float PCM
		# DTV : 32bit float PCM
		# HDMI : 32bit float PCM
		# ATV : 32bit float PCM
		# ANALOG : 32bit float PCM
		Description=config filter list of the pipeline for 32bit float PCM input at MM on Offload path
		FilterList="Format, Lpcm, Sync"
		RequiredCondition={
			InputSource="MM"
			InputSource="DTV"
			InputSource="HDMI"
			InputSource="ATV"
			InputSource="ANALOG"
			DecoderFormat="PcmFloat"
			PathType="Offload"
			PathType="HwAvSync"
		}
	}

	#SRC pipeline
	Strategy={
		# Src pipeline for offload and HwAvSync
		Description=config filter list of the pipeline for Src usage under offload/HwAvSync output
		FilterList="Src, Delay, Volume"
		RequiredCondition={
			PathType="Src"
		}
	}

	#Encoder pipeline
	Strategy={
		# ENCODER-1 : Dolby Digital Case
		Description=config filter list of the pipeline for DD encoder
		FilterList="Mixer, PcmR, Ac3p_Enc"
		RequiredCondition={
			EncoderFormat="DD"
		}
	}
	Strategy={
		# ENCODER-2 : Dolby Digital Plus Case
		Description=config filter list of the pipeline for DDP encoder
		FilterList="Mixer, PcmR, Ac3p_Enc"
		RequiredCondition={
			EncoderFormat="DDP"
		}
	}
	Strategy={
		# ENCODER-3 : MAT Encode Case
		Description=config filter list of the pipeline for MAT encoder
		FilterList="Mixer, PcmR, Mat_Enc"
		RequiredCondition={
			EncoderFormat="MAT"
		}
	}
	Strategy={
		# ENCODER-4 : DTS Encode Case
		Description=config filter list of the pipeline for DTS encoder
		FilterList="Mixer, Dts_Core2"
		RequiredCondition={
			EncoderFormat="DTS"
		}
	}
	Strategy={
		# ENCODER-5 : DTS HD Encode Case
		Description=config filter list of the pipeline for DTS HD encoder
		FilterList="Mixer, Dts_Core2"
		RequiredCondition={
			EncoderFormat="DTSHD"
		}
	}

	#Output pipeline
	Strategy={
		# SPEAKER-1 : normal case
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, Volume, Delay, SpeakerOutput"
		RequiredCondition={
			OutputDevice="SpeakerOutput"
		}
	}
	Strategy={
		# SPEAKER-1 : DTSVX case
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, Volume, DtsVX4_mbhl, Delay, SpeakerOutput"
		RequiredCondition={
			OutputDevice="SpeakerOutput"
			PostMode="DtsVX4"
		}
	}
	Strategy={
		# HEADPHONE-1 : normal case
		Description=config filter list of the pipeline for headphone output
		FilterList="Mixer, Volume, Delay, HeadphoneOutput"
		RequiredCondition={
			OutputDevice="HeadphoneOutput"
		}
	}
	Strategy={
		# HEADPHONE-2 : DTSVX case
		Description=config filter list of the pipeline for headphone output
		FilterList="Mixer, Volume, Delay, HeadphoneOutput"
		RequiredCondition={
			OutputDevice="HeadphoneOutput"
			PostMode="DtsVX4"
		}
	}
	Strategy={
		# BLUETOOTH-1 : normal case
		Description=config filter list of the pipeline for bluetooth output
		FilterList="Mixer, Volume, Delay, BluetoothOutput"
		RequiredCondition={
			OutputDevice="BluetoothOutput"
		}
	}
	Strategy={
		# BLUETOOTH-2 : DTSVX case
		Description=config filter list of the pipeline for bluetooth output
		FilterList="Mixer, Volume, DtsVX4, Delay, BluetoothOutput"
		RequiredCondition={
			OutputDevice="BluetoothOutput"
			PostMode="DtsVX4"
		}
	}
	Strategy={
		# USB-1 : normal case
		Description=config filter list of the pipeline for usb output
		FilterList="Mixer, Volume, Delay, UsbOutput"
		RequiredCondition={
			OutputDevice="UsbOutput"
		}
	}
	Strategy={
		# LOOPBACK-1 : normal case
		Description=config filter list of the pipeline for loopback
		FilterList="Loopback"
		RequiredCondition={
			OutputDevice="Loopback"
		}
	}
	Strategy={
		# ARC-1 : pcm case
		Description=config filter list of the pipeline for arc output
		FilterList="Mixer, Volume, Delay, ArcOutput"
		RequiredCondition={
			OutputDevice="ArcOutput"
			DigitalAudioFormat="PCM"
		}
	}
	Strategy={
		# ARC-2 : Non-pcm case
		Description=config filter list of the pipeline for arc output
		FilterList="Volume, Delay, ArcOutput"
		RequiredCondition={
			OutputDevice="ArcOutput"
			DigitalAudioFormat="NPCM"
		}
	}
	Strategy={
		# EARC-1 : normal case
		Description=config filter list of the pipeline for earc output
		FilterList="Mixer, Volume, Delay, EarcOutput"
		RequiredCondition={
			OutputDevice="EarcOutput"
			DigitalAudioFormat="PCM"
		}
	}
	Strategy={
		# EARC-2 : Non-pcm case
		Description=config filter list of the pipeline for earc output
		FilterList="Volume, Delay, EarcOutput"
		RequiredCondition={
			OutputDevice="EarcOutput"
			DigitalAudioFormat="NPCM"
		}
	}
	Strategy={
		# SPDIF-1 : normal case
		Description=config filter list of the pipeline for spdif output
		FilterList="Mixer, Volume, Delay, SpdifOutput"
		RequiredCondition={
			OutputDevice="SpdifOutput"
			DigitalAudioFormat="PCM"
		}
	}
	Strategy={
		# SPDIF-2 : Non-pcm case
		Description=config filter list of the pipeline for spdif output
		FilterList="Volume, Delay, SpdifOutput"
		RequiredCondition={
			OutputDevice="SpdifOutput"
			DigitalAudioFormat="NPCM"
		}
	}

	#Sound effect pipeline
	Strategy={
		# SPEAKER-1 : normal case postmode=Mpost
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, MseInputgain, MseAvc, MsePeq, MseTone, MseGeq, MseMvs, MseBalance, MseDrc, MseOutputgain, MseNr, Tcse, Delay"
		RequiredCondition={
			SETarget="SpeakerOutput"
			PostMode="Mpost"
		}
	}
	Strategy={
		# SPEAKER-2 : awe enable + postmode=Mpost
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, MseBalance, Delay, AudioWeaver"
		RequiredCondition={
			SETarget="awe_SpeakerOutput"
			PostMode="Mpost"
		}
	}
	Strategy={
		# SPEAKER-3 : normal case postmode=Dap
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, PcmR, Dap, MseMvs, MsePeq, MseBalance, MseNr, Tcse, Delay"
		RequiredCondition={
			SETarget="SpeakerOutput"
			PostMode="Dap"
		}
	}
	Strategy={
		# SPEAKER-4 : awe enable +  postmode=Dap
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, PcmR, Dap, MseBalance, Delay, AudioWeaver"
		RequiredCondition={
			SETarget="awe_SpeakerOutput"
			PostMode="Dap"
		}
	}
	Strategy={
		# SPEAKER-5 : normal case postmode=DtsVX4
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, DtsVX4, MseMvs, MsePeq, MseBalance, MseNr, Tcse, Delay"
		RequiredCondition={
			SETarget="SpeakerOutput"
			PostMode="DtsVX4"
		}
	}
	Strategy={
		# SPEAKER-6 : awe enable + postmode=DtsVX4
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, DtsVX4, MseBalance, Delay, AudioWeaver"
		RequiredCondition={
			SETarget="awe_SpeakerOutput"
			PostMode="DtsVX4"
		}
	}
	Strategy={
		# SPEAKER-7 : normal case postmode=Bypass
		Description=config filter list of the pipeline for speaker output
		FilterList="Mixer, Delay"
		RequiredCondition={
			SETarget="SpeakerOutput"
			PostMode="Bypass"
		}
	}
	Strategy={
		# HEADPHONE-1 : normal case postmode=Mpost
		Description=config filter list of the pipeline for headphone output
		FilterList="Mixer, MseInputgain, MseAvc, MseTone, MseGeq, MseMvs, MseBalance, MseDrc, MseOutputgain, Delay"
		RequiredCondition={
			SETarget="HeadphoneOutput"
			PostMode="Mpost"
		}
	}
	Strategy={
		# HEADPHONE-2 : normal case postmode=Bypass
		Description=config filter list of the pipeline for headphone output
		FilterList="Mixer, Delay"
		RequiredCondition={
			SETarget="HeadphoneOutput"
			PostMode="Bypass"
		}
	}
	Strategy={
		# HEADPHONE-3 : normal case postmode=Dap
		Description=config filter list of the pipeline for headphone output
		FilterList="Mixer, MseInputgain, MseAvc, MseTone, MseGeq, MseMvs, MseBalance, MseDrc, MseOutputgain, Delay"
		RequiredCondition={
			SETarget="HeadphoneOutput"
			PostMode="Dap"
		}
	}
	Strategy={
		# HEADPHONE-4 : normal case postmode=DtsVX4
		Description=config filter list of the pipeline for headphone output
		FilterList="Mixer, MseInputgain, MseAvc, MseTone, MseGeq, MseMvs, MseBalance, MseDrc, MseOutputgain, Delay"
		RequiredCondition={
			SETarget="HeadphoneOutput"
			PostMode="DtsVX4"
		}
	}
	Strategy={
		# BLUETOOTH-1 : normal case
		Description=config filter list of the pipeline for bluetooth output
		FilterList="Mixer, Delay"
		RequiredCondition={
			SETarget="BluetoothOutput"
		}
	}
	Strategy={
		# USB-1 : normal case
		Description=config filter list of the pipeline for usb output
		FilterList="Mixer, Delay"
		RequiredCondition={
		SETarget="UsbOutput"
		}
	}
	Strategy={
		# ARC-1 : pcm case
		Description=config filter list of the pipeline for arc output
		FilterList="Mixer, Delay"
		RequiredCondition={
			SETarget="ArcOutput"
		}
	}
	Strategy={
		# EARC-1 : normal case
		Description=config filter list of the pipeline for earc output
		FilterList="Mixer, Delay"
		RequiredCondition={
			SETarget="EarcOutput"
		}
	}
	Strategy={
		# SPDIF-1 : normal case
		Description=config filter list of the pipeline for spdif output
		FilterList="Mixer, Delay"
		RequiredCondition={
			SETarget="SpdifOutput"
		}
	}
	Strategy={
		# SPDIF-1 : normal case
		Description=config filter list of the pipeline for spdif output
		FilterList="Delay"
		RequiredCondition={
			SETarget="BypassOutput"
		}
	}
